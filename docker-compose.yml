# Optional alternative to the local quickstart (see README).
# Runs the agent on :8000 and the buggy demo API on :8001.
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./generated_tests:/srv/generated_tests
    depends_on:
      - demo-api

  demo-api:
    build: .
    command: uvicorn app.demo_api.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
